<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Pin</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 250px; color: #111; background: #fff; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    h1 small { font-weight: normal; color: #767676; font-size: 12px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #767676; margin: 14px 0 4px; }
    label { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
    #contagem { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eee; color: #444; line-height: 1.5; }
    #contagem strong { color: #e60023; }
    #contagem strong.ia { color: #6d28d9; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #eee; }
      #contagem { border-color: #333; color: #bbb; }
      #contagem strong.ia { color: #a78bfa; }
    }
  </style>
</head>
<body>
  <h1>Pin <small id="versao"></small></h1>
  <label><input type="checkbox" id="ligado"> Extensão ligada</label>

  <h2>Anúncios</h2>
  <label><input type="checkbox" id="marcar"> Só marcar (não esconder)</label>

  <h2>Pins feitos por IA</h2>
  <label><input type="radio" name="ia" value="marcar"> Mostrar selo "IA"</label>
  <label><input type="radio" name="ia" value="esconder"> Esconder</label>
  <label><input type="radio" name="ia" value="nada"> Não fazer nada</label>

  <div id="contagem">Abra o Pinterest para ver a contagem.</div>
  <script src="popup.js"></script>
</body>
</html>
